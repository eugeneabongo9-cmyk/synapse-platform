apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-orchestrator
  labels:
    app: synapse-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synapse-orchestrator
  template:
    metadata:
      labels:
        app: synapse-orchestrator
    spec:
      containers:
      - name: orchestrator
        image: synapse-orchestrator:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: synapse-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis:6379"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: synapse-orchestrator
spec:
  selector:
    app: synapse-orchestrator
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synapse-orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synapse-orchestrator
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
