version: "3.9"

services:
  orchestrator:
    build:
      context: ../services/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional: Uncomment if you want the Rust runtime running alongside
  # agent-runtime:
  #   build:
  #     context: ../services/agent-runtime
  #   environment:
  #     - RUST_LOG=info
